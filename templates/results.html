{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Quadratic Voting Results</h2>
<div class="grid gap-6">
    {% for p in proposals %}
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h3 class="text-xl font-semibold">{{ p.title }}</h3>
        <p class="text-gray-600 mb-2">{{ p.description }}</p>
        <div class="flex items-center gap-4">
            <span class="text-lg">Net Votes:</span>
            <span class="text-2xl font-bold {{ 'text-green-600' if p.total_votes >= 0 else 'text-red-600' }}">
                {{ p.total_votes }}
            </span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Create a New Proposal</h2>
<form method="POST" class="bg-white p-6 rounded-lg shadow-md max-w-lg">
    <label class="block mb-2 font-semibold">Title</label>
    <input type="text" name="title" required class="w-full border p-2 rounded mb-4">

    <label class="block mb-2 font-semibold">Description</label>
    <textarea name="description" rows="4" required class="w-full border p-2 rounded mb-4"></textarea>

    <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">Submit to Blockchain</button>
</form>
{% endblock %}
